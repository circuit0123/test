[project]
name = "circuit"
version = "0.1.0"
description = "Circuit: startup ecosystem platform backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "geoalchemy2>=0.20.0",
    "neo4j>=6.4.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the docker compose services running (skipped if unreachable)",
]
